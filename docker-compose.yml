# docker compose up --build        → app on http://10.11.174.165 (and :6767) with its own PostgreSQL
# docker compose up -d db          → only the database, for `npm run dev` on your machine
#
# Set POSTGRES_PASSWORD (and APP_PORT) in a .env file next to this one to change the defaults.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ottv2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ottv2}
      POSTGRES_DB: ottv2
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5433 so it doesn't clash with a PostgreSQL already running on 5432.
      # Bound to localhost only: players never talk to the database directly.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ottv2 -d ottv2"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ottv2:${POSTGRES_PASSWORD:-ottv2}@db:5432/ottv2
      PORT: 6767
      # Set in .env when publishing through the Cloudflare tunnel (see below).
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Each bot's thinking time per game (default 5 minutes).
      GAME_TIME_LIMIT_MS: ${GAME_TIME_LIMIT_MS:-}
    ports:
      # APP_PORT=8080 docker compose up   → serve on another host port
      - "${APP_PORT:-6767}:6767"
      # Also on port 80, so the plain address (http://10.11.174.165) works without ":6767".
      - "${HTTP_PORT:-80}:6767"
    volumes:
      - logs:/app/server/logs
    restart: unless-stopped

  # Cloudflare Tunnel: publishes the app at https://ottv2.m2048.io through an
  # OUTGOING connection, so this machine needs no public IP, port forwarding or
  # certificate. Cloudflare handles HTTPS.
  #
  # Start it with:  docker compose --profile tunnel up -d
  # In the tunnel's published application, the Service URL is http://app:6767.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # The OTTv2 tunnel's token, from .env (it's a credential; .env is gitignored).
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  logs:
